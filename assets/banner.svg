<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="neonBlur" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(.96) translate(0,0)}50%{opacity:.65;transform:scale(1.04) translate(15px,-10px)}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes floatPill3{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.grid-bg{fill:url(#grid)}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.badge-title,.pill-label,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.badge-title{font-weight:600;font-size:13px;fill:#c084fc;letter-spacing:2px;text-transform:uppercase}.sub-text{font-weight:400;font-size:17px;fill:#94a3b8}.pill-label{font-weight:600;font-size:13px;fill:#e2e8f0}.glow-sphere-1{animation:pulseGlow 7s ease-in-out infinite;transform-origin:200px 100px}.glow-sphere-2{animation:pulseGlow 9s ease-in-out infinite reverse;transform-origin:1000px 240px}.pill-1{animation:floatPill1 5s ease-in-out infinite}.pill-2{animation:floatPill2 6s ease-in-out infinite .8s}.pill-3{animation:floatPill3 5.5s ease-in-out infinite 1.5s}.data-flow-line{stroke-dasharray:6,8;animation:dashStream 3s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" class="grid-bg"/><g filter="url(#neonBlur)" opacity=".45"><circle cx="220" cy="110" r="130" fill="#6366f1" class="glow-sphere-1"/><circle cx="980" cy="220" r="140" fill="#ec4899" class="glow-sphere-2"/><circle cx="600" cy="180" r="110" fill="#a855f7" opacity=".3"/></g><g fill="none" stroke="url(#glowGrad)" stroke-width="1.5" opacity=".4"><path d="M 120 70 Q 280 180 500 130 T 900 120 T 1100 200" class="data-flow-line"/><path d="M 80 290 Q 320 220 620 270 T 1050 260" class="data-flow-line" style="animation-direction:reverse;animation-duration:4s"/></g><g transform="translate(80, 52)"><rect width="250" height="30" fill="#a855f7" fill-opacity=".15" stroke="#a855f7" stroke-opacity=".4" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4" fill="#10b981"/><text x="30" y="20" class="badge-title">CURATED AI DIRECTORY</text></g><g><text class="title-text" transform="translate(80, 138)">Awesome <tspan fill="url(#glowGrad)">AI Developer</tspan> Resources</text><text x="0" y="42" class="sub-text" transform="translate(80, 138)">The ultimate ecosystem guide: SaaS platforms, cookbooks, agent SDKs &amp; open-source engineering hubs.</text></g><g><g class="pill-1" transform="translate(80, 235) translate(0, 0)"><rect width="220" height="48" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity=".35" stroke-width="1" backdrop-filter="blur(10px)" rx="24"/><circle cx="28" cy="24" r="11" fill="#6366f1" fill-opacity=".25"/><text x="28" y="28" fill="#818cf8" font-size="13" text-anchor="middle">📚</text><text x="50" y="29" class="pill-label">Cookbooks &amp; Guides</text></g><g class="pill-2" transform="translate(80, 235) translate(240, 0)"><rect width="210" height="48" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity=".35" stroke-width="1" rx="24"/><circle cx="28" cy="24" r="11" fill="#a855f7" fill-opacity=".25"/><text x="28" y="28" fill="#c084fc" font-size="13" text-anchor="middle">🤖</text><text x="50" y="29" class="pill-label">Agent Orchestration</text></g><g class="pill-3" transform="translate(80, 235) translate(470, 0)"><rect width="200" height="48" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".35" stroke-width="1" rx="24"/><circle cx="28" cy="24" r="11" fill="#ec4899" fill-opacity=".25"/><text x="28" y="28" fill="#f472b6" font-size="13" text-anchor="middle">⚡</text><text x="50" y="29" class="pill-label">RAG &amp; Vector Infra</text></g><g class="pill-1" transform="translate(80, 235) translate(690, 0)"><rect width="180" height="48" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity=".35" stroke-width="1" rx="24"/><circle cx="28" cy="24" r="11" fill="#10b981" fill-opacity=".25"/><text x="28" y="28" fill="#34d399" font-size="13" text-anchor="middle">⭐</text><text x="50" y="29" class="pill-label">500k+ Stars Hub</text></g></g><rect width="1200" height="4" x="0" y="356" fill="url(#glowGrad)"/></svg>