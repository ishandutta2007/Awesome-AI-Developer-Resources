<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-bg { fill: url(#grid); }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #c084fc;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Dynamic CSS Keyframe Animations */
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(0.96) translate(0px, 0px); }
      50% { opacity: 0.65; transform: scale(1.04) translate(15px, -10px); }
      100% { opacity: 0.35; transform: scale(0.96) translate(0px, 0px); }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill3 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }

    .glow-sphere-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .glow-sphere-2 {
      animation: pulseGlow 9s ease-in-out infinite reverse;
      transform-origin: 1000px 240px;
    }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite 0.8s; }
    .pill-3 { animation: floatPill3 5.5s ease-in-out infinite 1.5s; }
    .data-flow-line {
      stroke-dasharray: 6, 8;
      animation: dashStream 3s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" class="grid-bg" />

  <!-- Animated Glowing Spheres (Pure Background Layer) -->
  <g opacity="0.45" filter="url(#neonBlur)">
    <circle class="glow-sphere-1" cx="220" cy="110" r="130" fill="#6366f1" />
    <circle class="glow-sphere-2" cx="980" cy="220" r="140" fill="#ec4899" />
    <circle cx="600" cy="180" r="110" fill="#a855f7" opacity="0.3" />
  </g>

  <!-- Animated Data Connection Lines (Behind Text & Cards) -->
  <g stroke="url(#glowGrad)" stroke-width="1.5" fill="none" opacity="0.4">
    <path class="data-flow-line" d="M 120 70 Q 280 180 500 130 T 900 120 T 1100 200" />
    <path class="data-flow-line" d="M 80 290 Q 320 220 620 270 T 1050 260" style="animation-direction: reverse; animation-duration: 4s;" />
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Tag / Pill -->
  <g transform="translate(80, 52)">
    <rect width="250" height="30" rx="15" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#10b981" />
    <text x="30" y="20" class="badge-title">CURATED AI DIRECTORY</text>
  </g>

  <!-- Title & Subtitle in crisp foreground -->
  <g transform="translate(80, 138)">
    <text class="title-text">
      Awesome <tspan fill="url(#glowGrad)">AI Developer</tspan> Resources
    </text>
    <text x="0" y="42" class="sub-text">
      The ultimate ecosystem guide: SaaS platforms, cookbooks, agent SDKs &amp; open-source engineering hubs.
    </text>
  </g>

  <!-- Floating Dynamic Tech Cards / Feature Badges -->
  <g transform="translate(80, 235)">
    <!-- Pill 1: Cookbooks & Docs -->
    <g class="pill-1" transform="translate(0, 0)">
      <rect width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.35" backdrop-filter="blur(10px)" />
      <circle cx="28" cy="24" r="11" fill="#6366f1" fill-opacity="0.25" />
      <text x="28" y="28" font-size="13" text-anchor="middle" fill="#818cf8">📚</text>
      <text x="50" y="29" class="pill-label">Cookbooks &amp; Guides</text>
    </g>

    <!-- Pill 2: Agent Frameworks -->
    <g class="pill-2" transform="translate(240, 0)">
      <rect width="210" height="48" rx="24" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.35" />
      <circle cx="28" cy="24" r="11" fill="#a855f7" fill-opacity="0.25" />
      <text x="28" y="28" font-size="13" text-anchor="middle" fill="#c084fc">🤖</text>
      <text x="50" y="29" class="pill-label">Agent Orchestration</text>
    </g>

    <!-- Pill 3: Evaluation & RAG -->
    <g class="pill-3" transform="translate(470, 0)">
      <rect width="200" height="48" rx="24" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.35" />
      <circle cx="28" cy="24" r="11" fill="#ec4899" fill-opacity="0.25" />
      <text x="28" y="28" font-size="13" text-anchor="middle" fill="#f472b6">⚡</text>
      <text x="50" y="29" class="pill-label">RAG &amp; Vector Infra</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g class="pill-1" transform="translate(690, 0)">
      <rect width="180" height="48" rx="24" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.35" />
      <circle cx="28" cy="24" r="11" fill="#10b981" fill-opacity="0.25" />
      <text x="28" y="28" font-size="13" text-anchor="middle" fill="#34d399">⭐</text>
      <text x="50" y="29" class="pill-label">500k+ Stars Hub</text>
    </g>
  </g>

  <!-- Bottom Accent Border Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#glowGrad)" />
</svg>
